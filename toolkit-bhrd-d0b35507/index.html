:root{--bg:#EEEDF3;--ink:#1B1A17;--mut:#6B6B74;--line:#E3E2EA;--card:#fff;--or:#F26B2B;--pu:#7048E8;--te:#0B7A70;--bl:#1C7ED6;--pi:#D6336C;--gr:#2B8A3E;--rd:#C92A2A;--ye:#FFD43B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'PPS Outfit',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(238,237,243,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}
.brand img{width:28px;height:28px;border-radius:50%}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--mut)}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 1px 0 var(--line)}
nav button.on{background:var(--ink);color:#fff}
main{width:100%;max-width:1180px;margin:0 auto;padding:16px 16px 60px}
.view{display:none}.view.on{display:block}
h1{font-size:30px;line-height:1.05;letter-spacing:-.03em;font-weight:800}
h2{font-size:24px;line-height:1.1;letter-spacing:-.02em;font-weight:800}
h3{font-size:16px;font-weight:700}
p{line-height:1.5}
.mut{color:var(--mut)}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 1px 0 var(--line)}
.grid{display:grid;gap:12px}
.tag{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:#fff}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pu)}
textarea{min-height:86px;resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.4}
.sec{border:1.5px dashed var(--line);border-radius:16px;padding:12px;margin-top:10px;position:relative}
.sec .x{position:absolute;right:8px;top:8px}
/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:linear-gradient(150deg,#845EF7,#5F3DC4);color:#fff;border-radius:24px;padding:20px}
.hero p{opacity:.92;margin-top:6px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}
.tool{border:0;text-align:left;background:#fff;border-radius:20px;padding:16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;box-shadow:0 1px 0 var(--line)}
.tool .ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px}
.tool b{display:block;font-size:16px}.tool span{font-size:13.5px;color:var(--mut);line-height:1.4;display:block;margin-top:2px}
.note{background:#FFF9DB;border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.45;margin-top:14px}
/* cv */
.cvwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.paperbox{position:sticky;top:110px}
.paper{background:#fff;border-radius:6px;padding:28px 30px;box-shadow:0 10px 30px -18px rgba(0,0,0,.4);font-family:Arial,Helvetica,sans-serif;color:#111;font-size:12.5px;line-height:1.45}
.paper h4{font-size:22px;margin-bottom:2px}
.paper .ct{font-size:12px;color:#333}
.paper h5{font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid #bbb;padding-bottom:2px;margin:14px 0 6px}
.paper ul{padding-left:18px}.paper li{margin:2px 0}
.paper .it{display:flex;justify-content:space-between;gap:10px;font-weight:700}.paper .it span{font-weight:400;white-space:nowrap}
.paper .sub{font-style:italic;color:#444}
.chk{display:grid;gap:6px;margin-top:8px}
.chk div{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.4;padding:8px 10px;border-radius:10px}
.chk .ok{background:#EBFBEE}.chk .no{background:#FFF0F0}
.empty{color:#999;font-style:italic}
/* output text */
.out{white-space:pre-wrap;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:14.5px;line-height:1.55;min-height:120px}
.tabs{display:flex;gap:6px;margin:12px 0 8px}
.tabs button{border:0;border-radius:999px;padding:7px 14px;font-weight:700;background:#fff;cursor:pointer}
.tabs button.on{background:var(--pu);color:#fff}
/* latihan */
.qcard{background:linear-gradient(150deg,#845EF7,#5F3DC4);color:#fff;border-radius:24px;padding:20px;min-height:150px}
.qcard .q{font-size:24px;font-weight:800;line-height:1.2;margin-top:10px;letter-spacing:-.01em}
.timer{font-size:44px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.timer.warn{color:var(--rd)}
.rub{display:grid;gap:8px;margin-top:10px}
.rub .r1{background:#FFE3E3;border-radius:12px;padding:10px 12px}.rub .r5{background:#D3F9D8;border-radius:12px;padding:10px 12px}
.rub .cj{border:2px solid var(--gr);border-radius:12px;padding:10px 12px;background:#fff}
.rub b{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.score{display:flex;gap:6px}.score button{flex:1;border:0;border-radius:12px;padding:12px 0;font-size:18px;font-weight:800;background:#fff;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line)}
.score button:hover{background:#F3F0FF}
.hist{display:grid;gap:6px;margin-top:8px;font-size:13.5px}
.hist div{display:flex;justify-content:space-between;gap:10px;background:#fff;border-radius:10px;padding:8px 10px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{background:#fff;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:26px}
/* gaji */
.big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.cl label.c{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:15px;font-weight:500;margin:0;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.cl input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--gr)}
.cl label.c.done span{text-decoration:line-through;color:var(--mut)}
.bar{height:10px;background:#F1F3F5;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gr);border-radius:99px;transition:width .3s}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

(()=>{

async function buka(k,a){

 q('#app').innerHTML=p.html;
